<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="header.css">
        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="simulation.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <style>
        #fiberCanvas {
            position: absolute;
            top: 250px; /* Adjust based on your header height */
            left: 400px; /* Adjust based on your user-input width */
            background-color: rgba(214, 45, 45, 0.6); /* Dark background for the laser */
            border-radius: 2px;
            border-color: black;
            border-width: 3px;
            border-style: solid;
        }
        .graph{
            position: absolute;
            top: 280px;
            left: 1400px;
        }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="left">
                OFW Simulater
            </div>
            <div class="right">
                <a href="index.html" class="a1"><p>Home</p></a>
                <a href="simulation.html" class="a2"><p>Simulation</p></a>
                <a href="about.html" class="a2"><p>About</p></a>
                <button onclick="togglelogin()">Login</button>
            </div>
        </div>

        <div class="login">
            <p>Login</p>
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="Password">
            <button onclick="togglelogin()">Enter</button>
        </div>

        <div class="user-input">
            <p class="base">Refractive Index (CORE)</p>
            <div>
                <input type="range" class="slider" min="1" max="2" step="0.01">
                <div class="output" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>
            <p class="base">Refractive Index (CLADDING)</p>
             <div>
                <input type="range" class="slider2" min="1" max="2" step="0.01">
                <div class="output2" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>
            <p class="base">Acceptance Angle (in degree)</p>
             <div>
                <input type="range" class="slider3" min="0" max="90" step="1">
                <div class="output3" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>
            <p class="base">Core Length (in Meter)</p>
             <div>
                <input type="range" class="slider4" min="100" max="900" step="10">
                <div class="output4" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>

            <p class="base">Core Width (in Micrometer)</p>
             <div>
                <input type="range" class="slider5" min="50" max="300" step="1">
                <div class="output5" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>

            <button onclick="tir()">APPLY</button>
            <p class="result">none</p>
            
        </div>

        <canvas id="fiberCanvas" width="900" height="450"></canvas>

        <div class="graph">
            <canvas id="graphCanvas" width="400" height="400" style="border: 1px solid #444; background: #ffffff;"></canvas>
            <p style="color: white; font-family: Arial; font-size: 14px; text-align: center;">Attenuation Graph: Power (%) vs Distance (m)</p>
        </div>

        <script>
             function togglelogin()

            {

                document.querySelector('.login').classList.toggle('active');

            }

            const slider=document.querySelector('.slider');

            const output=document.querySelector('.output');

            output.innerHTML=slider.value;

            slider.oninput=function() {

                output.innerHTML=slider.value;

            }



            const slider2=document.querySelector('.slider2');

            const output2=document.querySelector('.output2');

            output2.innerHTML=slider2.value;

            slider2.oninput=function() {

                output2.innerHTML=slider2.value;

            }



            const slider3=document.querySelector('.slider3');

            const output3=document.querySelector('.output3');

            output3.innerHTML=slider3.value;

            slider3.oninput=function() {

                output3.innerHTML=slider3.value;

            }



            const slider4=document.querySelector('.slider4');

            const output4=document.querySelector('.output4');

            output4.innerHTML=slider4.value;

            slider4.oninput=function() {

                output4.innerHTML=slider4.value;

            }

            const slider5=document.querySelector('.slider5');
            const output5=document.querySelector('.output5');
            output5.innerHTML=slider5.value;
            slider5.oninput=function() {
                output5.innerHTML=slider5.value;

            }


            // ANIMATION LOGIC
            let animationID;

            function tir() {
            cancelAnimationFrame(animationID);

            // Inputs
            const n1 = parseFloat(slider.value);
            const n2 = parseFloat(slider2.value);
            const thetaA_deg = parseFloat(slider3.value);
            const coreWidth = parseFloat(slider5.value); 
            const actualLength = parseFloat(slider4.value); 
            const result = document.querySelector('.result');
            
            const canvas = document.getElementById('fiberCanvas');
            const ctx = canvas.getContext('2d');
            const graphCanvas = document.getElementById('graphCanvas');
            const gctx = graphCanvas.getContext('2d');

            // Clear Both Canvases
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            gctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            const centerY = canvas.height / 2;
            const topWall = centerY - (coreWidth / 2);
            const bottomWall = centerY + (coreWidth / 2);

            // --- GRAPH AXES DRAWING ---
            const padding = 40;
            gctx.strokeStyle = "#888";
            gctx.lineWidth = 2; // Axis line-ku 2 podhum, graph curve-ku thaan bold venum
            gctx.beginPath();
            gctx.moveTo(padding, padding); 
            gctx.lineTo(padding, graphCanvas.height - padding); 
            gctx.lineTo(graphCanvas.width - padding, graphCanvas.height - padding); 
            gctx.stroke();

            gctx.fillStyle = "black";
            gctx.font = "Bold 15px Arial";
            gctx.fillText("Power (%)", 5, 30);
            gctx.fillText("Distance (m)", graphCanvas.width - 95, graphCanvas.height - 10);

            // Core Boundary Drawing
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, topWall, canvas.width, coreWidth);

            // Scale Drawing
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.beginPath();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.moveTo(30, topWall); ctx.lineTo(30, bottomWall);
            ctx.stroke();
            ctx.fillText(coreWidth + " µm", 40, centerY + 5);

            if (n1 > n2) {
                const thetaC = Math.asin(n2 / n1) * (180 / Math.PI);
                const thetaA_rad = thetaA_deg * (Math.PI / 180);
                const sin_theta_r = Math.sin(thetaA_rad) / n1;
                const theta_r_rad = Math.asin(sin_theta_r);
                const theta_interface = 90 - (theta_r_rad * 180 / Math.PI);

                let x = 0;
                let y = centerY; 
                let speedX = 3;
                let speedY = Math.tan(theta_r_rad) * speedX; 
                let totalBounces = 0; 
                const lengthScaleFactor = actualLength / 900;

                if (theta_interface > thetaC) {
                    result.innerHTML = "Total Internal Reflection!";
                    result.style.color = "#00ff00";

                    // --- GRAPH PATH SETUP ---
                    gctx.beginPath(); 
                    gctx.strokeStyle = "#00ffff";
                    gctx.lineWidth = 3; // Graph curve nalla bold-ah theriya
                    let isFirstPoint = true;

                    function animate() {
                        if (x < canvas.width) {
                            let oldX = x;
                            let oldY = y;

                            x += speedX;
                            y += speedY;

                            if (y <= topWall || y >= bottomWall) { 
                                y = (y <= topWall) ? topWall : bottomWall;
                                speedY *= -1;
                                totalBounces += (1 * lengthScaleFactor); 
                            }

                            // Attenuation Calculation
                            let reflectionPower = Math.pow(0.85, totalBounces); 
                            let currentDistanceInMeters = (x / canvas.width) * actualLength;
                            let distancePower = Math.pow(0.998, currentDistanceInMeters);
                            let totalPower = reflectionPower * distancePower;
                            let brightness = Math.max(0, 255 * totalPower);

                            result.innerHTML = `Total Reflections: ${Math.floor(totalBounces)}`;

                            // --- GRAPH DRAWING ---
                            let graphX = padding + (x / canvas.width) * (graphCanvas.width - padding * 2);
                            let graphY = (graphCanvas.height - padding) - (totalPower * (graphCanvas.height - padding * 2)); 

                            if (isFirstPoint) {
                                gctx.moveTo(graphX, graphY);
                                isFirstPoint = false;
                            } else {
                                gctx.lineTo(graphX, graphY);
                                gctx.stroke();
                            }

                            // --- RAY DRAWING ---
                            ctx.beginPath();
                            ctx.moveTo(oldX, oldY);
                            ctx.lineTo(x, y);
                            ctx.strokeStyle = `rgb(0, ${brightness}, ${brightness})`;
                            ctx.lineWidth = 6;
                            ctx.lineCap = 'round';
                            ctx.stroke();

                            animationID = requestAnimationFrame(animate);
                        } else {
                            let finalPower = Math.floor((Math.pow(0.85, totalBounces) * Math.pow(0.998, actualLength)) * 100);
                            result.innerHTML += ` | Final Signal Power: ${finalPower}%`;
                        }
                    }
                    animate();
                } else {
                    result.innerHTML = "Refraction (Signal Loss)";
                    result.style.color = "#ff4444";
                    ctx.strokeStyle = "#ff4444";
                    ctx.beginPath();
                    ctx.moveTo(0, centerY);
                    ctx.lineTo(150, centerY + (150 * Math.tan(theta_r_rad)));
                    ctx.stroke();
                }
            } else {
                result.innerHTML = "Error: n1 must be > n2";
                result.style.color = "orange";
            }
        }
        </script>
    </body>
</html>
