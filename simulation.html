<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="header.css">
        <link rel="stylesheet" href="login.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header">
            <div class="left">
                OFW Simulater
            </div>
            <div class="right">
                <a href="index.html" class="a1"><p>Home</p></a>
                <a href="simulation.html" class="a2"><p>Simulation</p></a>
                <a href="about.html" class="a2"><p>About</p></a>
                <button onclick="togglelogin()">Login</button>
            </div>
        </div>

        <div class="login">
            <p>Login</p>
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="Password">
            <button onclick="togglelogin()">Enter</button>
        </div>

        <script>
            function togglelogin()
            {
                document.querySelector('.login').classList.toggle('active');
                document.querySelector('.body').classList.toggle('active');
            }
            function togglemove()
            {
                document.querySelector('a1').classList.toggle('active');
                document.querySelector('a2').classList.toggle('active');
                document.querySelector('a3').classList.toggle('active');

            }
        </script>
    </body>
</html>
