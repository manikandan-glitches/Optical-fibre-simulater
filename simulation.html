<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="header.css">
        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="simulation.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header">
            <div class="left">
                OFW Simulater
            </div>
            <div class="right">
                <a href="index.html" class="a1"><p>Home</p></a>
                <a href="simulation.html" class="a2"><p>Simulation</p></a>
                <a href="about.html" class="a2"><p>About</p></a>
                <button onclick="togglelogin()">Login</button>
            </div>
        </div>

        <div class="login">
            <p>Login</p>
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="Password">
            <button onclick="togglelogin()">Enter</button>
        </div>

        <div class="user-input">
            <p class="base">Refractive Index (CORE)</p>
            <div>
                <input type="range" class="slider" min="1" max="2" step="0.01">
                <div class="output" style="display: inline-block; background-color:rgb(27, 25, 25); color: white; height: 22px; width: 32px;"></div>
            </div>
            <p class="base">Refractive Index (CLADDING)</p>
             <div>
                <input type="range" class="slider" min="1" max="2" step="0.01">
                <div class="output" style="display: inline-block; background-color:rgb(27, 25, 25); height: 22px; width: 32px;"></div>
            </div>
            <p class="base">Acceptance Angle (in degree)</p>
             <div>
                <input type="range" min="0" max="90" step="1">
                <div style="display: inline-block; background-color:rgb(27, 25, 25); height: 22px; width: 32px;"></div>
            </div>
            
        </div>

        <script>
            function togglelogin()
            {
                document.querySelector('.login').classList.toggle('active');
            }
            const slider=document.querySelector('.slider');
            const output=document.querySelector('.output');
            output.innerhtml=slider.value;
            
        </script>
    </body>
</html>
